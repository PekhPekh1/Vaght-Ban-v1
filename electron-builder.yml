appId: com.vaqtban.desktop
productName: Vaqtban
copyright: "Vaqtban HR Suite"

extraMetadata:
  name: vaqtban-desktop
  description: "Vaqtban — Persian HR attendance & payroll suite (desktop)"
  author: Vaqtban
  main: electron/main.cjs
  private: true

asar: false

directories:
  output: release

files:
  - electron/**/*
  - .next/standalone/**/*
  - .next/static/**/*
  - public/**/*
  - build/icon.ico
  - build/icon.png

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: "وقت‌بان"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
